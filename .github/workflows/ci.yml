name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Без TensorFlow: тестам нужны только предобработка и подготовка данных.
      # Версии берутся из requirements.txt.
      - name: Install dependencies
        run: pip install -c requirements.txt numpy pandas librosa soundfile pytest ruff

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest -q
